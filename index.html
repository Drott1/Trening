<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Min träning</title>
<style>
:root{--bg:#0b1220;--panel:#131e31;--panel2:#1a2942;--text:#f4f7fb;--muted:#9eacc0;--accent:#8ed081;--line:#2a3a55;--danger:#ef8d8d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#09111e,#101c30 55%,#0b1423);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
.app{max-width:760px;margin:auto;padding:22px 16px 80px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.8px}.sub{color:var(--muted);font-size:14px}
button,.pill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700}
button{cursor:pointer}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.tab{font-size:13px;padding:10px 4px}.tab.active{background:var(--accent);color:#102014;border-color:var(--accent)}button:disabled{opacity:.75;cursor:default}
.hero{background:linear-gradient(135deg,#172842,#132038);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:23px}.hero p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill{font-size:12px;padding:7px 10px}
.exercise{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:9px 0}
.row{display:flex;gap:12px;align-items:flex-start}.check{width:23px;height:23px;accent-color:var(--accent);margin-top:2px;flex:none}.name{font-size:17px;font-weight:800}.pattern{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}.details{margin-top:6px;color:#c4cedb;font-size:13px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.link{display:inline-block;text-decoration:none;color:#dff6d9;border:1px solid #38553a;background:#17271c;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:750}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:20px 0 8px}.footer{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}
.timer{position:sticky;bottom:14px;background:rgba(13,21,35,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:17px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 35px #0007;margin-top:18px}.timer strong{font-size:22px;font-variant-numeric:tabular-nums}.timer small{display:block;color:var(--muted)}
.progress{height:7px;background:#26344a;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:var(--accent);width:0%;transition:.2s}
.reset{color:#ffd0d0;border-color:#593737;background:#25191b}
@media(max-width:430px){h1{font-size:26px}.tabs{gap:5px}.tab{font-size:12px}.app{padding-left:12px;padding-right:12px}}

.loggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.loggrid label{font-size:11px;color:var(--muted);display:block}
.loggrid input{width:100%;margin-top:4px;background:#0d1727;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:14px}
.sets{display:grid;gap:7px;margin-top:10px}
.setrow{display:grid;grid-template-columns:36px 1fr 1fr;gap:7px;align-items:center}
.setrow span{color:var(--muted);font-size:12px}
.setrow input{width:100%;background:#0d1727;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px}
.historybar{height:8px;background:#26344a;border-radius:99px;overflow:hidden;margin-top:8px}
.historybar div{height:100%;background:var(--accent);width:0}
@media(max-width:430px){.loggrid{grid-template-columns:1fr 1fr}.setrow{grid-template-columns:28px 1fr 1fr}}

.chartwrap{margin-top:12px;background:#0d1727;border:1px solid var(--line);border-radius:12px;padding:10px}
.charttitle{font-size:12px;color:var(--muted);margin-bottom:5px}
canvas{width:100%;height:180px;display:block}
.chartselect{margin-top:8px;width:100%;background:#0d1727;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}

.recommend{margin-top:10px;padding:10px 11px;border:1px solid #38553a;background:#14231a;border-radius:11px;font-size:13px}
.recommend b{color:#dff6d9}.hint{color:var(--muted);font-size:11px;margin-top:3px}

.amrapcard{border-color:#4a5568}
.amraptimer{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:center;background:#0d1727}
.amraptimer strong{display:block;font-size:42px;letter-spacing:1px;margin-bottom:10px}
.amrapcontrols{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.amrapweights,.amrapresult{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.amrapresult{grid-template-columns:1fr 1fr}
.amrapweights label,.amrapresult label{font-size:12px;color:var(--muted)}
.amrapweights input,.amrapresult input{width:100%;box-sizing:border-box;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700}
@media(max-width:430px){.amrapweights{grid-template-columns:1fr 1fr}.amrapweights label:last-child{grid-column:1/-1}}

.mode-switch{display:flex;gap:8px;margin-top:14px}
.mode-switch button{flex:1}
.mode-switch button.active{background:var(--accent);color:#0b1725;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Min träning 💪</h1><div class="sub">4 pass · 30–45 min · hantelbaserat</div></div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button onclick="document.getElementById("importFile").click()">Importera</button><button onclick="exportData()">Exportera</button><button onclick="resetWeek()">Nollställ data</button></div>
    <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0]);this.value=''">
  </div>

  <div class="tabs" id="tabs"></div>
  <main id="content"></main>

  <div class="timer">
    <div><small>Vila</small><strong id="time">01:00</strong></div>
    <div style="display:flex;gap:7px"><button onclick="startTimer()">Start</button><button onclick="stopTimer()">Stopp</button></div>
  </div>
  <div class="footer">Tekniklänkar öppnas i en ny flik. Data sparas lokalt på enheten. · v22 Exportera gärna en backup före större uppdateringar.</div>
</div>

<script>
const workouts = [
 {name:"Dag 1",title:"Squat + pull + carry",desc:"Helkropp med knäböj, drag, höft och grepp.",ex:[
  ["Hantel thruster","Squat + push","3 × 8–12","Gå ner i en kontrollerad knäböj och använd kraften från benen för att pressa hantlarna över huvudet.","https://www.youtube.com/watch?v=1KYPZ-Jzo3w"],
  ["Pull-up / assisterad pull-up","Pull · vertikalt","3 × 5–10","Gör kontrollerade reps. Använd band eller assisterad maskin om du behöver.","https://www.youtube.com/watch?v=eGo4IYlbE5g"],
  ["Rumänska marklyft","Hinge","3 × 8–12","Mjuk knävinkel, skjut höften bakåt och håll hantlarna nära benen.","https://www.youtube.com/watch?v=aa57T45iFSE"],
  ["Enarms hantelrodd","Pull · horisontellt","3 × 8–12/sida","Stöd ena handen och dra hanteln mot höften. Håll ryggen stabil.","https://www.youtube.com/watch?v=6KNmHxw-SpE"],
  ["Farmer's carry","Carry","2 × 40–60 sek","Tungt men kontrollerat. Gå stolt och håll bålen stabil.","https://www.youtube.com/watch?v=Kh0871u60z0"]
 ]},
 {name:"Dag 2",title:"Clean + press + ben",desc:"Explosiv höft, ensidigt benarbete, press och bål.",ex:[
  ["Hantel hang clean","Power","3 × 6–8","Starta med hantlarna vid låren. Explodera med höften och fånga hantlarna vid axlarna.","https://www.youtube.com/watch?v=hFXPxXkYr_o"],
  ["Bulgarian split squat","Squat","2–3 × 8–10/ben","Bakre fot på stol eller soffa. Sänk dig kontrollerat och tryck upp med främre benet.","https://www.youtube.com/watch?v=mroWnR22q54"],
  ["Hantelpress på golv","Push · horisontellt","3 × 8–12","Ligg på rygg. Sänk armbågarna kontrollerat tills överarmarna når golvet.","https://www.youtube.com/watch?v=T0Y3OBF1bNI"],
  ["Hantelsving","Hinge + power","3 × 12–20","Driv hanteln med höften, inte med armarna. Håll bålen spänd.","https://www.youtube.com/watch?v=cfYt7Q21w_0"],
  ["Russian twist","Core","2 × 10–15/sida","Rotera kontrollerat från bålen och håll rörelsen stabil.","https://www.youtube.com/watch?v=LlccOWys8IU"]
 ]},
 {name:"Dag 3",title:"Lunge + push + pull",desc:"Ensidig benstyrka, press, drag och tungt bärande.",ex:[
  ["Bakåtutfall → knälyft","Lunge + balance","3 × 8–10/ben","Ta ett steg bakåt, pressa upp och avsluta med ett kontrollerat knälyft.","https://www.youtube.com/watch?v=lKhZvT_NkOs"],
  ["Hantel push press","Push · power","3 × 8–12","Böj lätt i knäna och använd benen för att hjälpa hantlarna upp över huvudet.","https://www.youtube.com/watch?v=vuaYVK8xyqo"],
  ["Enarms hantelrodd","Pull · horisontellt","3 × 8–12/sida","Dra hanteln mot höften och håll skuldran kontrollerad.","https://www.acefitness.org/resources/everyone/exercise-library/126/single-arm-row/"],
  ["Hantel snatch","Power · unilateral","3 × 6–8/sida","Explosivt från golvet till över huvudet. Låt höft och ben skapa kraften och håll vikten nära kroppen.","https://www.youtube.com/watch?v=gm4ln6PO4rc"],
  ["Suitcase carry","Carry","2 × 40–60 sek/sida","Bär en tung hantel i ena handen. Gå utan att luta kroppen åt sidan.","https://www.youtube.com/watch?v=jKnLY_MXIoA"]
 ]},
 {name:"Dag 4",title:"Helkropp + kondition",desc:"Helkropp med explosiv styrka och ett kort AMRAP-finisher.",ex:[
  ["Devil's press","Helkropp + power","3 × 6–10","Burpee med hantlar följt av en flytande press över huvudet. Håll tempot kontrollerat.","https://www.youtube.com/watch?v=AYqBIKnjm1I"],
  ["Goblet squat","Squat","3 × 8–12","Håll en hantel framför bröstet. Sitt ner kontrollerat och res dig genom hela foten.","https://www.youtube.com/watch?v=nfX7IFK9UNI"],
  ["Pull-up / assisterad pull-up","Pull · vertikalt","3 × 5–10","Kontrollerade reps. Använd band eller assisterad maskin om du behöver.","https://www.nasm.org/resource-center/exercise-library/pull-up"],
  ["Hantelpress på golv","Push · horisontellt","3 × 8–12","Ligg på rygg och pressa hantlarna kontrollerat från golvet.","https://library.theprehabguys.com/vimeo-video/floor-press-with-dumbbell/"],
  ["AMRAP 8 min","AMRAP","8 min","Så många varv som möjligt på 8 minuter: 8 hantelsvingar, 8 walking lunges och 6 burpees. Logga rundor + extra reps efteråt.","https://www.crossfit.com/faq/exercises"]
 ]}

];

const homeWorkouts = [
 {name:"Dag 1",title:"Hemma · squat + pull + push",desc:"Enkelt helkroppspass med stång, ringar och kroppsvikt.",ex:[
  ["Air squat","Squat","3 × 15–25","Sätt dig kontrollerat och res dig genom hela foten. Gör rörelsen långsammare när du behöver mer motstånd.","https://www.youtube.com/watch?v=aclHkVaku9U"],
  ["Pull-up / assisterad pull-up","Pull · vertikalt","3 × 5–10","Använd stången hemma. Kör assisterat med band om du behöver.","https://www.youtube.com/watch?v=eGo4IYlbE5g"],
  ["Ring rows","Pull · horisontellt","3 × 8–15","Luta kroppen lagom mycket och dra bröstet mot ringarna. Håll kroppen rak.","https://www.youtube.com/watch?v=8jP2L8q6xWQ"],
  ["Push-ups","Push · horisontellt","3 × 8–20","Spänn bålen och sänk bröstet kontrollerat. Anpassa genom att höja händerna vid behov.","https://www.youtube.com/watch?v=IODxDxX7oi4"],
  ["Pilates core","Core","2–3 × 30–60 sek","Välj 2–3 kontrollerade Pilates-bålövningar, till exempel dead bug, toe taps eller hollow hold.","https://www.youtube.com/watch?v=K56Z12XNQ5c"]
 ]},
 {name:"Dag 2",title:"Hemma · ben + push + pull",desc:"Ensidigt benarbete, press, drag och bål utan gym.",ex:[
  ["Bulgarian split squat","Squat","3 × 8–15/ben","Bakre fot på stol eller soffa. Sänk dig kontrollerat och tryck upp med främre benet.","https://www.youtube.com/watch?v=2C-uNgKwPLE"],
  ["Push-ups","Push · horisontellt","3 × 8–20","Håll kroppen rak och armbågarna kontrollerade. Gör dem svårare genom att höja fötterna.","https://www.youtube.com/watch?v=IODxDxX7oi4"],
  ["Bakåtutfall → knälyft","Lunge + balance","3 × 8–12/ben","Stega bakåt, pressa upp och avsluta med ett kontrollerat knälyft.","https://www.youtube.com/watch?v=lKhZvT_NkOs"],
  ["Ring rows","Pull · horisontellt","3 × 8–15","Dra bröstet mot ringarna och håll kroppen stabil.","https://www.youtube.com/watch?v=8jP2L8q6xWQ"],
  ["Pilates core","Core","2–3 × 30–60 sek","Välj 2–3 kontrollerade Pilates-bålövningar och prioritera kvalitet framför tempo.","https://www.youtube.com/watch?v=K56Z12XNQ5c"]
 ]},
 {name:"Dag 3",title:"Hemma · pull + push + squat",desc:"Ett lite enklare pass som är lätt att få gjort även när gymmet inte hinns med.",ex:[
  ["Pull-up / assisterad pull-up","Pull · vertikalt","3 × 5–10","Kontrollerade reps från häng till bröstet högt mot stången. Använd band vid behov.","https://www.youtube.com/watch?v=eGo4IYlbE5g"],
  ["Push-ups","Push · horisontellt","3 × 8–20","Sänk dig kontrollerat och pressa upp med hela överkroppen.","https://www.youtube.com/watch?v=IODxDxX7oi4"],
  ["Air squat","Squat","3 × 15–25","Kontrollerade repetitioner. Lägg in en paus i botten om kroppsvikt blir för lätt.","https://www.youtube.com/watch?v=aclHkVaku9U"],
  ["Ring rows","Pull · horisontellt","3 × 8–15","Gör kroppen mer horisontell för att öka belastningen.","https://www.youtube.com/watch?v=8jP2L8q6xWQ"],
  ["Pilates core","Core","2–3 × 30–60 sek","Välj 2–3 Pilates-bålövningar och håll rörelsen långsam och kontrollerad.","https://www.youtube.com/watch?v=K56Z12XNQ5c"]
 ]},
 {name:"Dag 4",title:"Hemma · helkropp + AMRAP",desc:"Kort och konditionsbetonat pass med bara stång, ringar och kroppsvikt.",ex:[
  ["Devil's press utan hantlar","Helkropp","3 × 8–12","Gör en burpee och res dig explosivt med armarna över huvudet. Håll tempot kontrollerat.","https://www.youtube.com/watch?v=AYqBIKnjm1I"],
  ["Bulgarian split squat","Squat","3 × 8–15/ben","Kontrollerat och djupt efter förmåga. Använd stol eller soffa som stöd för bakre foten.","https://www.youtube.com/watch?v=2C-uNgKwPLE"],
  ["Pull-up / assisterad pull-up","Pull · vertikalt","3 × 5–10","Kontrollerade reps. Använd band om du behöver.","https://www.youtube.com/watch?v=eGo4IYlbE5g"],
  ["Push-ups","Push · horisontellt","3 × 8–20","Välj en variant där du kan arbeta med bra teknik.","https://www.youtube.com/watch?v=IODxDxX7oi4"],
  ["AMRAP 8 min","AMRAP","8 min","Så många varv som möjligt på 8 minuter: 5 pull-ups, 10 push-ups, 15 air squats och 20 mountain climbers. Logga rundor + extra reps efteråt.","https://www.youtube.com/watch?v=U5n9LkT2b9A"]
 ]},

];

let day = Number(localStorage.getItem("day") || 0);
let workoutMode = localStorage.getItem("workoutMode") || "gym";
let checks = JSON.parse(localStorage.getItem("checks") || "{}");
if(workoutMode==="gym"){
  const migrated={};
  Object.entries(checks).forEach(([k,v])=>{ migrated["gym-"+k]=v; });
  checks=migrated;
}
let history = JSON.parse(localStorage.getItem("history") || "[]");
function dedupeHistory(){
  const seen=new Set();
  const clean=[];
  for(const x of history){
    const mode=x.mode||"gym";
    const key=`${x.date}|${x.day}|${mode}`;
    if(seen.has(key)) continue;
    seen.add(key);
    clean.push({...x,mode});
  }
  history=clean;
  localStorage.setItem("history",JSON.stringify(history));
}
dedupeHistory();

let logs = JSON.parse(localStorage.getItem("logs") || "{}");
let view = localStorage.getItem("view") || "workout";
const DATA_VERSION = 5;

/*
  Data format:
  v1: logs used "date-index" keys, which could collide between workout days.
  v2: logs use "date|exercise-name" keys.

  Migration uses the workout history to identify which day an old log belonged to.
  If the old format is ambiguous, it is preserved in legacyLogs instead of being
  silently assigned to the wrong exercise.
*/
function migrateData(){
  let storedVersion = Number(localStorage.getItem("dataVersion") || 0);
  if(storedVersion >= DATA_VERSION) return;

  const rawLogs = logs && typeof logs === "object" ? logs : {};
  const oldEntries = Object.entries(rawLogs).filter(([k])=>/^20\d{2}-\d{2}-\d{2}\|/.test(k));

  oldEntries.forEach(([k,v])=>{
    const parts=k.split("|");
    const date=parts[0], id=parts.slice(1).join("|");
    if(parts.length!==2) return;

    // If the old log can be tied to a completed workout on that date,
    // assign it to that day's workout. If several matching days exist,
    // keep the old record untouched as a legacy backup rather than guessing.
    const matches=(history||[]).filter(h=>h.date===date && workouts[h.day]?.ex?.some(e=>exerciseId(e[0])===id));
    if(matches.length===1){
      logs[date+"|"+matches[0].day+"|"+id]=v;
      delete logs[k];
    }
  });

  localStorage.setItem("dataVersion",String(DATA_VERSION));
  localStorage.setItem("logs",JSON.stringify(logs));
}
migrateData();

function saveAll(){
  localStorage.setItem("workoutMode",workoutMode);
  localStorage.setItem("checkWeek",weekKey());
  localStorage.setItem("day",day);
  localStorage.setItem("checks",JSON.stringify(checks));
  localStorage.setItem("history",JSON.stringify(history));
  localStorage.setItem("logs",JSON.stringify(logs));
}
function activeWorkouts(){return workoutMode==="home"?homeWorkouts:workouts;}
function activeWorkout(){return activeWorkouts()[day];}
function key(i){return workoutMode+"-"+day+"-"+i}
function dateKey(d=new Date()){return d.toISOString().slice(0,10)}
function weekKey(d=new Date()){
  const x=new Date(d);
  const day=x.getDay()||7;
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-day+1);
  return x.toISOString().slice(0,10);
}
function ensureCurrentWeek(){
  const current=weekKey();
  const stored=localStorage.getItem("checkWeek");
  if(stored!==current){
    checks={};
    localStorage.setItem("checkWeek",current);
    localStorage.setItem("checks",JSON.stringify(checks));
  }
}

function prettyDate(s){
  const d=new Date(s+"T12:00:00");
  return d.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"});
}
function weekKey(s){
  const d=new Date(s+"T12:00:00");
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=x.getUTCDay()||7;
  x.setUTCDate(x.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  const week=Math.ceil((((x-yearStart)/86400000)+1)/7);
  return x.getUTCFullYear()+"-W"+String(week).padStart(2,"0");
}
function exerciseId(name){return name.trim().toLowerCase();}
function logKey(date,name,workoutDay=day,mode=workoutMode){return date+"|"+mode+"|"+workoutDay+"|"+exerciseId(name);}
function legacyLogKey(date,name,workoutDay=day){return date+"|"+workoutDay+"|"+exerciseId(name);}
function isPullup(name){return name.toLowerCase().includes("pull-up");}
function isCarry(name){return name.toLowerCase().includes("carry");}
function isAmrap(name){return name==="AMRAP 8 min";}function isHomeTimed(name){return workoutMode==="home" && name==="Pilates core";}
function isHomeBodyweight(name){
  if(workoutMode!=="home") return false;
  return ["Air squat","Push-ups","Bulgarian split squat","Bakåtutfall → knälyft","Ring rows","Devil's press utan hantlar"].includes(name);
}
function amrapKey(date=dateKey(), workoutDay=3, mode=workoutMode){return date+"|"+mode+"|"+workoutDay+"|amrap";}
function getAmrapLog(date=dateKey(), workoutDay=3){
  const k=amrapKey(date,workoutDay);
  return logs[k] || {
    rounds:"", extra:"",
    exercises:[
      {name:"Hantelsving",weight:""},
      {name:"Walking lunges",weight:""},
      {name:"Burpees",weight:""}
    ]
  };
}
function saveAmrapField(field,value){
  const k=amrapKey(), x=getAmrapLog();
  x[field]=value; logs[k]=x; localStorage.setItem("logs",JSON.stringify(logs));
}
function saveAmrapWeight(index,value){
  const k=amrapKey(), x=getAmrapLog();
  x.exercises[index].weight=value; logs[k]=x; localStorage.setItem("logs",JSON.stringify(logs));
}
function amrapHistory(){
  return Object.entries(logs)
    .filter(([k,v])=>{
      const p=k.split("|");
      return v && (p.length===4 ? p[3]==="amrap" : p[2]==="amrap") && (v.rounds!=="" || v.extra!=="");
    })
    .map(([k,v])=>{
      const p=k.split("|");
      return p.length===4
        ? {date:p[0],mode:p[1],day:Number(p[2]),...v}
        : {date:p[0],mode:"gym",day:Number(p[1]),...v};
    })
    .sort((a,b)=>a.date.localeCompare(b.date)||a.day-b.day);
}
function lastAmrapResult(){
  const h=amrapHistory().filter(x=>x.mode===workoutMode);
  return h.length ? h[h.length-1] : null;
}
function amrapResultText(x){
  if(!x) return "";
  const r=Number(x.rounds)||0, e=Number(x.extra)||0;
  return r+" rundor + "+e+" reps";
}
function amrapWeightText(x){
  if(!x?.exercises) return "";
  return x.exercises.map(e=>e.name+": "+(e.weight!==""?e.weight+" kg":"ej angiven")).join(" · ");
}
let amrapTimerId=null, amrapEnd=0, amrapRemaining=480, amrapRunning=false, amrapWakeLock=null;
async function requestAmrapWakeLock(){
  try{
    if("wakeLock" in navigator && !amrapWakeLock) amrapWakeLock=await navigator.wakeLock.request("screen");
  }catch(e){}
}
async function releaseAmrapWakeLock(){
  try{if(amrapWakeLock){await amrapWakeLock.release();amrapWakeLock=null;}}catch(e){amrapWakeLock=null;}
}
function formatAmrapTime(s){
  s=Math.max(0,Math.ceil(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function updateAmrapTimer(){
  if(!amrapRunning) return;
  amrapRemaining=Math.max(0,(amrapEnd-Date.now())/1000);
  const el=document.getElementById("amrapTime");
  if(el) el.textContent=formatAmrapTime(amrapRemaining);
  if(amrapRemaining<=0){
    amrapRunning=false; clearInterval(amrapTimerId); amrapTimerId=null;
    releaseAmrapWakeLock();
    if(navigator.vibrate) navigator.vibrate([250,100,250]);
    const status=document.getElementById("amrapStatus");
    if(status) status.textContent="⏱ Tiden är slut! Fyll i rundor och extra reps.";
  }
}
async function startAmrap(){
  if(amrapRunning) return;
  if(amrapRemaining<=0) amrapRemaining=480;
  amrapEnd=Date.now()+amrapRemaining*1000;
  amrapRunning=true;
  await requestAmrapWakeLock();
  clearInterval(amrapTimerId); amrapTimerId=setInterval(updateAmrapTimer,200);
  updateAmrapTimer();
  const status=document.getElementById("amrapStatus"); if(status) status.textContent="Kör! Försök hålla ett jämnt tempo.";
}
function pauseAmrap(){
  if(!amrapRunning) return;
  amrapRemaining=Math.max(0,(amrapEnd-Date.now())/1000);
  amrapRunning=false; clearInterval(amrapTimerId); amrapTimerId=null;
  releaseAmrapWakeLock();
  const status=document.getElementById("amrapStatus"); if(status) status.textContent="Pausad. Tryck Fortsätt när du är redo.";
  updateAmrapTimer();
}
function stopAmrap(){
  amrapRunning=false; clearInterval(amrapTimerId); amrapTimerId=null;
  releaseAmrapWakeLock(); amrapRemaining=480;
  const el=document.getElementById("amrapTime"); if(el) el.textContent="08:00";
  const status=document.getElementById("amrapStatus"); if(status) status.textContent="Timern är stoppad.";
}
function toggleAmrap(index,checked){
  if(checked){
    const k=amrapKey(), x=getAmrapLog();
    logs[k]=x; localStorage.setItem("logs",JSON.stringify(logs));
  }
  checks[key(index)]=checked; saveAll(); render();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&amrapRunning) requestAmrapWakeLock();});

function setCount(name, prescription){
  // Prescriptions like "2 × ..." mean exactly 2 sets.
  // "2–3 × ..." or "3 × ..." retain the flexible/required number.
  return /^2 ×/.test(prescription) ? 2 : 3;
}
function getLog(date,name){
  const k=logKey(date,name);
  if(logs[k]) return logs[k];
  // Read older v15-v22 gym records so an app update does not lose previous logs.
  const legacy=logs[legacyLogKey(date,name)];
  if(legacy && workoutMode==="gym") return legacy;
  if(isPullup(name)) return {sets:[{kg:"",reps:"",mode:"Utan assistans"},{kg:"",reps:"",mode:"Utan assistans"},{kg:"",reps:"",mode:"Utan assistans"}]};
  if(isHomeTimed(name)) return {sets:[{seconds:""},{seconds:""},{seconds:""}]};
  if(isHomeBodyweight(name)) return {sets:[{reps:""},{reps:""},{reps:""}]};
  if(isCarry(name)) return {sets:[{kg:"",seconds:""},{kg:"",seconds:""},{kg:"",seconds:""}]};
  return {sets:[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}]};
}
function saveLog(name,setIndex,field,value){
  const d=dateKey(), k=logKey(d,name), x=getLog(d,name);
  x.sets[setIndex][field]=value;
  logs[k]=x;
  localStorage.setItem("logs",JSON.stringify(logs));
}
function exerciseHistory(name){
  const id=exerciseId(name);
  return Object.entries(logs)
    .filter(([k,v])=>{
      const p=k.split("|");
      if(p.length===4) return p[0]?.startsWith("20") && p[3]===id;
      return p.length>=3 && p[0]?.startsWith("20") && p.slice(2).join("|")===id;
    })
    .map(([k,v])=>{
      const p=k.split("|");
      return p.length===4
        ? {date:p[0],mode:p[1],day:Number(p[2]),sets:v.sets||[]}
        : {date:p[0],mode:"gym",day:Number(p[1]),sets:v.sets||[]};
    })
    .filter(x=>x.sets.some(s=>s.reps!=="" || s.seconds!==""))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.day-b.day);
}

function homeRecommendation(name){
  const entries=exerciseHistory(name).filter(x=>x.mode==="home");
  if(isHomeTimed(name)){
    if(!entries.length) return "Välj 2–3 kontrollerade Pilates-bålövningar och börja med cirka 30–60 sekunder per övning.";
    return "Förslag idag: håll samma övningar och försök slå förra passets tid med bibehållen kontroll.";
  }
  if(!entries.length) return "Första gången: välj en variant där du kan göra alla set med bra teknik. Öka reps eller gör varianten svårare över tid.";
  const last=entries[entries.length-1];
  const vals=(last.sets||[]).filter(s=>s.reps!=="").map(s=>Number(s.reps)).filter(Number.isFinite);
  if(!vals.length) return "Fyll i reps från förra passet för att få ett förslag.";
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  if(avg>=20) return "Förslag idag: gör varianten svårare eller lägg in långsammare reps. Behåll god teknik.";
  if(avg>=12) return "Förslag idag: försök slå förra passets reps innan du gör övningen svårare.";
  return "Förslag idag: behåll samma variant och bygg gradvis fler reps.";
}
function recommendation(name){
  if(workoutMode==="home") return homeRecommendation(name);
  const entries=exerciseHistory(name);
  if(isCarry(name)){
    if(!entries.length) return "Första gången: välj en vikt där du kan gå stabilt i cirka 40–60 sekunder.";
    const last=entries[entries.length-1];
    const sets=(last.sets||[]).filter(s=>s.seconds!=="" && s.kg!=="" && Number.isFinite(Number(s.seconds)) && Number.isFinite(Number(s.kg)));
    if(!sets.length) return "Fyll i vikt och sekunder från förra passet för att få ett förslag.";
    const maxKg=Math.max(...sets.map(s=>Number(s.kg)));
    const avgSec=sets.reduce((a,s)=>a+Number(s.seconds),0)/sets.length;
    if(avgSec>=60){
      const next=Math.round((maxKg+2)*2)/2;
      return `Förslag idag: <b>${next} kg</b> och sikta på <b>40–60 sek</b>. Du klarade ${Math.round(avgSec)} sek i snitt senast.`;
    }
    if(avgSec>=40) return `Förslag idag: behåll <b>${maxKg} kg</b> och försök komma närmare 60 sek per set.`;
    return `Förslag idag: behåll <b>${maxKg} kg</b> och försök bygga upp tiden mot 40 sek.`;
  }
  if(isPullup(name)){
    if(!entries.length) return "Första gången: registrera varje set som <b>utan assistans</b> eller <b>med band</b>. Försök bygga reps utan assistans över tid.";
    const last=entries[entries.length-1];
    const sets=(last.sets||[]).filter(s=>s.reps!=="");
    if(!sets.length) return "Fyll i reps från förra passet för att få ett förslag.";
    const free=sets.filter(s=>(s.mode||"Utan assistans")==="Utan assistans");
    const band=sets.filter(s=>(s.mode||"Utan assistans")==="Med band");
    const freeAvg=free.length ? free.reduce((a,s)=>a+Number(s.reps),0)/free.length : 0;
    if(freeAvg>=10) return "Förslag idag: försök öka repsen utan assistans eller lägg till ett set utan band.";
    if(free.length) return "Förslag idag: behåll nivån utan assistans och försök slå förra passets reps. Bandset kan användas efteråt.";
    if(band.length) return "Förslag idag: försök få fler reps med samma band, och testa gärna ett set utan assistans först.";
    return "Förslag idag: registrera om setet var utan assistans eller med band.";
  }
  if(!entries.length) return "Första gången: välj en vikt där du har cirka 2–3 reps kvar i tanken.";
  const last=entries[entries.length-1];
  const complete=last.sets.filter(s=>s.kg!==""&&s.reps!=="").map(s=>({kg:Number(s.kg),reps:Number(s.reps)}));
  if(!complete.length) return "Fyll i vikt och reps från förra passet för att få ett förslag.";
  const maxKg=Math.max(...complete.map(s=>s.kg));
  const avgReps=complete.reduce((a,s)=>a+s.reps,0)/complete.length;
  if(avgReps>=12){
    const next=Math.round((maxKg+2)*2)/2;
    return `Förslag idag: <b>${next} kg</b> och sikta på <b>8–12 reps</b>. Du nådde ${Math.round(avgReps*10)/10} reps i snitt senast.`;
  }
  if(avgReps>=10) return `Förslag idag: behåll <b>${maxKg} kg</b> och försök slå förra passets reps.`;
  if(avgReps>=8) return `Förslag idag: behåll <b>${maxKg} kg</b> och försök lägga till 1 rep på något set.`;
  const down=Math.max(1,Math.round((maxKg-1)*2)/2);
  return `Förslag idag: behåll <b>${maxKg} kg</b> om tekniken känns bra. Om du inte når 8 reps, prova <b>${down} kg</b>.`;
}
function previousResult(name,mode=workoutMode){
  const e=exerciseHistory(name).filter(x=>x.mode===mode);
  if(!e.length)return "";
  const s=e[e.length-1].sets.filter(x=>x.reps!=="");
  if(!s.length)return "";
  if(isPullup(name)){
    return "Senast: "+s.map((x,i)=>`${x.mode||"Utan assistans"} × ${x.reps}`).join(" · ");
  }
  if(isCarry(name)){
    const carried=e[e.length-1].sets.filter(x=>x.kg!==""&&x.seconds!==""&&Number.isFinite(Number(x.seconds)));
    const legacy=e[e.length-1].sets.filter(x=>x.kg!==""&&x.seconds==="");
    if(carried.length) return "Senast: "+carried.map(x=>`${x.kg} kg × ${x.seconds} sek`).join(" · ");
    if(legacy.length) return "Senast: äldre logg utan registrerad tid. Fyll i sekunder på nästa pass.";
    return "";
  }
  if(workoutMode==="home"){
    const reps=s.filter(x=>x.reps!=="");
    return reps.length ? "Senast: "+reps.map(x=>`${x.reps} reps`).join(" · ") : "";
  }
  const weighted=s.filter(x=>x.kg!=="");
  return weighted.length ? "Senast: "+weighted.map(x=>`${x.kg} kg × ${x.reps}`).join(" · ") : "";
}

])},${j},'kg',this.value)"><input type="number" min="0" step="1" placeholder="reps" value="${s.reps}" onchange="saveLog(${JSON.stringify(e[0])},${j},'reps',this.value)"></div>`).join("")}</div><div class="actions"><a class="link" href="${e[4]}" target="_blank" rel="noopener">▶ Se kort video ↗</a></div></div></div></article>`;

function completeWorkout(){
 const today=dateKey(), w=activeWorkout();
 if(!history.some(x=>x.date===today&&x.day===day&&(x.mode||"gym")===workoutMode)){
   history.push({date:today,day:day,name:w.name,title:w.title,mode:workoutMode});
   history.sort((a,b)=>a.date.localeCompare(b.date));
 }
 saveAll(); render();
}
function setWorkoutMode(mode){
 if(mode!==workoutMode){
   workoutMode=mode;
   saveAll();
 }
 render();
}

function toggle(i,v){
  const article=document.querySelectorAll(".exercise")[i];
  const exerciseName=activeWorkout().ex[i][0];
  if(article){
    const x=getLog(dateKey(),exerciseName);
    const n=setCount(exerciseName,activeWorkout().ex[i][2]);
    if(isPullup(exerciseName)){
      const rows=article.querySelectorAll(".sets .setrow");
      rows.forEach((row,j)=>{
        const select=row.querySelector("select"), input=row.querySelector("input");
        if(select)x.sets[j].mode=select.value;
        if(input)x.sets[j].reps=input.value;
      });
    }else if(isHomeTimed(exerciseName)){
      const inputs=article.querySelectorAll(".sets input");
      for(let j=0;j<n;j++) x.sets[j].seconds=inputs[j]?.value ?? x.sets[j].seconds;
    }else if(isHomeBodyweight(exerciseName)){
      const inputs=article.querySelectorAll(".sets input");
      for(let j=0;j<n;j++) x.sets[j].reps=inputs[j]?.value ?? x.sets[j].reps;
    }else if(isCarry(exerciseName)){
      const inputs=article.querySelectorAll(".sets input");
      for(let j=0;j<n;j++){
        x.sets[j].kg=inputs[j*2]?.value ?? x.sets[j].kg;
        x.sets[j].seconds=inputs[j*2+1]?.value ?? x.sets[j].seconds;
      }
    }else{
      const inputs=article.querySelectorAll(".sets input");
      for(let j=0;j<n;j++){
        x.sets[j].kg=inputs[j*2]?.value ?? x.sets[j].kg;
        x.sets[j].reps=inputs[j*2+1]?.value ?? x.sets[j].reps;
      }
    }
    logs[logKey(dateKey(),exerciseName)]=x;
  }
  checks[key(i)]=v;
  saveAll();
  render();
}

function exportData(){
  const backup={
    app:"Min träning",
    dataVersion:DATA_VERSION,
    exportedAt:new Date().toISOString(),
    day,checks,checkWeek:weekKey(),history,logs
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="min-traning-backup-"+dateKey()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data.app!=="Min träning" || !data.logs || !data.history || !data.checks){
        throw new Error("Ogiltig backup");
      }
      if(!confirm("Importera denna backup och ersätta data som finns i appen nu?")){
        return;
      }
      day=Number(data.day||0);
      checks=data.checks||{};
      const importedWeek=data.checkWeek||"";
      if(importedWeek===weekKey()){
        const importedChecks={};
        Object.entries(checks).forEach(([k,v])=>{ importedChecks[k.includes("-")?k:"gym-"+k]=v; });
        checks=importedChecks;
      }else{
        checks={};
      }
      history=data.history||[];
      logs=data.logs||{};
      localStorage.setItem("dataVersion",String(DATA_VERSION));
      saveAll();
      render();
      alert("Backupen är importerad. 💪");
    }catch(e){
      alert("Kunde inte läsa backupfilen.");
    }
  };
  reader.readAsText(file);
}

function resetWeek(){
  const first=confirm(
    "VARNING: Detta raderar alla sparade träningsdata i appen, inklusive vikt/reps, markerade övningar och träningshistorik.\n\nÄr du säker?"
  );
  if(!first)return;
  const second=confirm(
    "Det går inte att ångra detta härifrån. Har du exporterat en backup om du vill kunna återställa datan?"
  );
  if(!second)return;
  checks={};history=[];logs={};
  localStorage.setItem("dataVersion",String(DATA_VERSION));
  localStorage.removeItem("legacyLogs");
  saveAll();render();
}
function chartCanvas(exerciseName,canvasId){
  const c=document.getElementById(canvasId); if(!c)return;
  const ctx=c.getContext("2d"),pull=isPullup(exerciseName),carry=isCarry(exerciseName);
  const data=exerciseHistory(exerciseName).map(x=>{
    if(pull){
      const vals=x.sets.filter(s=>s.reps!=="").map(s=>Number(s.reps)).filter(Number.isFinite);
      return {date:x.date,value:vals.length?Math.max(...vals):0};
    }
    if(carry){
      const vals=x.sets.filter(s=>s.kg!==""&&s.seconds!==""&&Number.isFinite(Number(s.kg))).map(s=>Number(s.kg));
      return {date:x.date,value:vals.length?Math.max(...vals):0};
    }
    const vals=x.sets.filter(s=>s.kg!==""&&s.reps!==""&&Number.isFinite(Number(s.kg))).map(s=>Number(s.kg));
    return {date:x.date,value:vals.length?Math.max(...vals):0};
  }).filter(x=>x.value>0);

  const dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=180*dpr;ctx.scale(dpr,dpr);
  const W=rect.width,H=180,pad={l:38,r:12,t:16,b:28},max=Math.max(1,...data.map(x=>x.value)),range=max;
  ctx.clearRect(0,0,W,H);ctx.strokeStyle="#2a3a55";ctx.lineWidth=1;
  const unit=pull?" reps":" kg";
  for(let j=0;j<=4;j++){
    const y=pad.t+(H-pad.t-pad.b)*j/4;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle="#9eacc0";ctx.font="10px system-ui";ctx.textAlign="right";
    ctx.fillText((max-(range*j/4)).toFixed(pull?0:(max<10?1:0))+unit,pad.l-6,y+3);
  }
  if(!data.length){
    ctx.fillStyle="#9eacc0";ctx.font="13px system-ui";ctx.textAlign="center";
    ctx.fillText("Logga några pass för att få en kurva",W/2,H/2);return;
  }
  const x=i=>data.length===1?W/2:pad.l+(W-pad.l-pad.r)*i/(data.length-1),y=v=>pad.t+(H-pad.t-pad.b)*(1-v/range);
  ctx.strokeStyle="#8ed081";ctx.lineWidth=3;ctx.beginPath();
  data.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.value)):ctx.moveTo(x(i),y(p.value)));ctx.stroke();
  data.forEach((p,i)=>{ctx.fillStyle="#8ed081";ctx.beginPath();ctx.arc(x(i),y(p.value),4,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle="#9eacc0";ctx.font="10px system-ui";ctx.textAlign="center";
  const picks=data.length<=4?data:[data[0],data[Math.floor((data.length-1)/2)],data[data.length-1]];
  picks.forEach(p=>{const i=data.indexOf(p);ctx.fillText(prettyDate(p.date),x(i),H-9);});
}

function renderHistory(){
 const sessions=history.length,weeks=new Set(history.map(x=>weekKey(x.date))),sorted=[...history].sort((a,b)=>b.date.localeCompare(a.date));
 let streak=0;const active=[...weeks].sort().reverse();
 if(active[0]===weekKey(dateKey())){streak=1;for(let i=1;i<active.length;i++){if((weekStart(active[i-1])-weekStart(active[i]))===7)streak++;else break;}}
 const first=sorted.length?sorted[sorted.length-1].date:null;
 let html=`<section class="hero"><h2>Din träningshistorik 📈</h2><p>Här ser du kontinuitet och progression. Samma övning delar historik mellan dagar, men olika övningar hålls separerade.</p><div class="meta"><span class="pill">📅 ${weeks.size} veckor</span><span class="pill">💪 ${sessions} pass</span><span class="pill">🔥 ${streak} veckor i rad</span><span class="pill">🚀 ${first?`Start: ${prettyDate(first)}`:"Ingen start ännu"}</span></div></section>`;
 if(!sessions) html+=`<div class="exercise"><div class="name">Historiken börjar här.</div><div class="details">Markera ett pass som klart för att börja bygga historiken.</div></div>`;
 else{
   html+=`<div class="section-title">Progression per övning</div>`;
   const seen=new Set();
   workouts.forEach(w=>w.ex.forEach(e=>{
     const id=exerciseId(e[0]);if(seen.has(id))return;seen.add(id);
     const entries=exerciseHistory(e[0]);if(!entries.length)return;
     const latest=entries[entries.length-1];
     let latestText="",bestText="",chartTitle="";
     if(isPullup(e[0])){
       const sets=latest.sets.filter(s=>s.reps!=="");
       latestText=sets.length?sets.map(s=>`${s.mode||"Utan assistans"} × ${s.reps}`).join(" · "):"Ingen komplett logg";
       const best=entries.reduce((acc,x)=>{x.sets.forEach(s=>{const reps=Number(s.reps);if(s.reps!==""&&Number.isFinite(reps)&&reps>acc.reps)acc={reps,date:x.date,mode:s.mode||"Utan assistans"};});return acc;},{reps:0,date:"",mode:""});
       bestText=best.reps?`<div class="details">Flest reps utan/med assistans: <b>${best.reps} reps</b> <span style="color:var(--muted)">(${prettyDate(best.date)}, ${best.mode})</span></div>`:"";
       chartTitle="Flest reps per pass";
     }else if(isCarry(e[0])){
       const sets=latest.sets.filter(s=>s.kg!==""&&s.seconds!==""&&Number.isFinite(Number(s.seconds)));
       const oldSets=latest.sets.filter(s=>s.kg!==""&&s.seconds==="");
       latestText=sets.length?sets.map(s=>`${s.kg} kg × ${s.seconds} sek`).join(" · "):oldSets.length?`${oldSets.map(s=>`${s.kg} kg × ? sek`).join(" · ")} (äldre logg saknar tid)`:"Ingen komplett logg";
       const best=entries.reduce((acc,x)=>{x.sets.forEach(s=>{const kg=Number(s.kg),sec=Number(s.seconds);if(s.kg!==""&&s.seconds!==""&&Number.isFinite(kg)&&Number.isFinite(sec)&&kg>acc.kg)acc={kg,seconds:sec,date:x.date};});return acc;},{kg:0,seconds:0,date:""});
       bestText=best.kg?`<div class="details">Tyngsta registrerade set: <b>${best.kg} kg × ${best.seconds} sek</b> <span style="color:var(--muted)">(${prettyDate(best.date)})</span></div>`:"";
       chartTitle="Tyngsta vikt per pass";
     }else{
       const nums=latest.sets.filter(s=>s.kg!==""&&s.reps!=="").map(s=>({kg:Number(s.kg),reps:Number(s.reps)})).filter(s=>Number.isFinite(s.kg)&&Number.isFinite(s.reps));
       const best=entries.reduce((acc,x)=>{x.sets.forEach(s=>{const kg=Number(s.kg),reps=Number(s.reps);if(s.kg!==""&&s.reps!==""&&Number.isFinite(kg)&&Number.isFinite(reps)&&kg>acc.kg)acc={kg,reps,date:x.date};});return acc;},{kg:0,reps:0,date:""});
       latestText=nums.length?nums.map(s=>`${s.kg} kg × ${s.reps}`).join(" · "):"Ingen komplett logg";
       bestText=best.kg?`<div class="details">Tyngsta registrerade set: <b>${best.kg} kg × ${best.reps}</b> <span style="color:var(--muted)">(${prettyDate(best.date)})</span></div>`:"";
       chartTitle="Tyngsta vikt per pass";
     }
     const cid="chart-"+encodeURIComponent(id);
     html+=`<article class="exercise"><div class="name">${e[0]}</div><div class="details">Senast: <b>${latestText}</b></div>${bestText}<div class="chartwrap"><div class="charttitle">${chartTitle}</div><canvas id="${cid}"></canvas></div></article>`;
   }));
   html+=`<div class="section-title">Veckor</div>`;
   const grouped={};sorted.forEach(x=>(grouped[weekKey(x.date)]??=[]).push(x));
   Object.entries(grouped).forEach(([wk,items])=>{html+=`<article class="exercise"><div class="name">${wk}</div><div class="details" style="margin-top:9px">${items.map(x=>`<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0"><span>${x.name}</span><span style="color:var(--muted)">${prettyDate(x.date)}</span></div>`).join("")}</div></article>`});
   html+=`<div class="section-title">Alla pass</div>`;
   html+=sorted.map(x=>`<article class="exercise"><div class="row"><div style="font-size:22px">✓</div><div><div class="name">${x.title}</div><div class="details">${prettyDate(x.date)} · ${x.name}</div></div></div></article>`).join("");
 }
 document.getElementById("content").innerHTML=html;
 document.querySelectorAll('canvas[id^="chart-"]').forEach(c=>chartCanvas(decodeURIComponent(c.id.slice(6)),c.id));
 const ah=amrapHistory();
 if(ah.length){
   html+=`<div class="section-title">🔥 AMRAP-resultat</div>`;
   ah.slice().reverse().forEach(x=>{
     html+=`<article class="exercise"><div class="name">${prettyDate(x.date)} · ${amrapResultText(x)}</div><div class="details">${amrapWeightText(x)}</div></article>`;
   });
 }

}
function weekStart(wk){
 const [y,w]=wk.split("-W").map(Number),jan4=new Date(y,0,4,12);
 const day=jan4.getDay()||7,monday=new Date(jan4);
 monday.setDate(jan4.getDate()-day+1+(w-1)*7);
 return monday.getTime();
}
let timer=60, interval=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function draw(){document.getElementById("time").textContent=fmt(timer)}
function startTimer(){if(interval)return;interval=setInterval(()=>{timer--;draw();if(timer<=0){stopTimer();navigator.vibrate?.([200,100,200]);alert("Vilan är slut. Dags för nästa set! 💪")}},1000)}
function stopTimer(){clearInterval(interval);interval=null;timer=60;draw()}
draw();render();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!sessionStorage.getItem("pwaReloaded")) {
      sessionStorage.setItem("pwaReloaded","1");
      location.reload();
    }
  });
  window.addEventListener("load", async () => {
    try {
      const reg=await navigator.serviceWorker.register("./sw.js?v=16");
      if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
      setTimeout(()=>reg.update(),1500);
    } catch(e){}
  });
}
